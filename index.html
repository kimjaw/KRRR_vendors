<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1a1a'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='14' font-weight='800' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-soft: #6b6b6b;
    --text-muted: #9a9a9a;
    --border: #ececec;
    --border-strong: #1a1a1a;
    --accent: #1a1a1a;
    --accent-soft: #f4f4ef;

    /* Category palette */
    --cat-fashion-bg: #eef2ff;
    --cat-fashion-fg: #3a3f7a;
    --cat-food-bg: #ecf6e6;
    --cat-food-fg: #3d6a2a;
    --cat-beauty-bg: #fdecef;
    --cat-beauty-fg: #8a2840;
    --cat-kids-bg: #fff1e0;
    --cat-kids-fg: #8a4a16;
    --cat-wedding-bg: #f5ecf9;
    --cat-wedding-fg: #5a2c7a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* HERO */
  .hero {
    padding: 80px 0 56px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .hero .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 18px;
  }
  .hero h1 {
    font-size: clamp(34px, 5vw, 56px);
    font-weight: 800;
    margin: 0 0 16px;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .hero .subtitle {
    font-size: 17px;
    color: var(--text-soft);
    max-width: 640px;
    margin: 0;
  }
  .hero .meta {
    margin-top: 28px;
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--text-muted);
  }
  .hero .meta strong {
    color: var(--text);
    font-weight: 700;
    margin-right: 4px;
  }

  /* CONTROLS */
  .controls {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(250, 250, 247, 0.92);
    backdrop-filter: saturate(180%) blur(12px);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
  }
  .controls-inner {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tab {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-soft);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .tab .count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .tab:hover {
    border-color: var(--text-soft);
    color: var(--text);
  }
  .tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .tab.active .count {
    background: rgba(255,255,255,0.18);
    color: #fff;
  }

  .search {
    margin-left: auto;
    position: relative;
    flex: 1 1 240px;
    max-width: 320px;
    min-width: 200px;
  }
  .search input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    padding: 10px 16px 10px 40px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    outline: none;
    transition: border-color 0.18s ease;
  }
  .search input::placeholder { color: var(--text-muted); }
  .search input:focus { border-color: var(--text); }
  .search svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--text-muted);
  }

  /* SECTIONS */
  main { padding: 48px 0 96px; }
  .section { margin-bottom: 56px; scroll-margin-top: 100px; }
  .section.hidden { display: none; }
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .section-header h2 {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .section-header .section-count {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .section-header .section-desc {
    margin-left: auto;
    font-size: 13px;
    color: var(--text-muted);
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 20px 18px;
    transition: all 0.2s ease;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 132px;
  }
  .card:hover {
    border-color: var(--border-strong);
    transform: translateY(-2px);
    box-shadow: 0 6px 24px -10px rgba(0,0,0,0.12);
  }
  .card .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .card .name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.3;
    word-break: keep-all;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .badge.cat-fashion  { background: var(--cat-fashion-bg);  color: var(--cat-fashion-fg); }
  .badge.cat-food     { background: var(--cat-food-bg);     color: var(--cat-food-fg); }
  .badge.cat-beauty   { background: var(--cat-beauty-bg);   color: var(--cat-beauty-fg); }
  .badge.cat-kids     { background: var(--cat-kids-bg);     color: var(--cat-kids-fg); }
  .badge.cat-wedding  { background: var(--cat-wedding-bg);  color: var(--cat-wedding-fg); }

  .card .url {
    font-size: 12px;
    color: var(--text-muted);
    word-break: break-all;
    margin-top: auto;
    line-height: 1.4;
  }
  .card .visit {
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }
  .card .visit::after {
    content: "→";
    transition: transform 0.18s ease;
    display: inline-block;
  }
  .card:hover .visit::after { transform: translateX(3px); }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 64px 24px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 32px 0;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
  }
  footer a {
    color: var(--text-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
  }
  footer a:hover { color: var(--text); }

  @media (max-width: 640px) {
    .hero { padding: 56px 0 40px; }
    .hero .meta { gap: 16px; font-size: 12px; }
    .controls-inner { gap: 12px; }
    .search { margin-left: 0; max-width: none; }
    .section-header { flex-wrap: wrap; }
    .section-header .section-desc { margin-left: 0; flex-basis: 100%; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { padding: 16px; min-height: 120px; }
    .card .name { font-size: 15px; }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="container">
    <div class="eyebrow">KRRR · Vendor Directory</div>
    <h1>KRRR 입점 업체 리스트</h1>
    <p class="subtitle">회원 여러분께 안내드리는 KRRR 공식 입점 업체 디렉토리입니다. 카테고리별로 둘러보거나 업체명·품목으로 바로 검색해 보세요.</p>
    <div class="meta">
      <span><strong id="total-count">31</strong>개 입점 업체</span>
      <span><strong>5</strong>개 카테고리</span>
      <span>업데이트 기준 · <strong>2026.02.13</strong></span>
    </div>
  </div>
</header>

<nav class="controls">
  <div class="container controls-inner">
    <div class="tabs" id="tabs"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.5-3.5"></path>
      </svg>
      <input id="search" type="text" placeholder="업체명·사이트로 검색" />
    </div>
  </div>
</nav>

<main>
  <div class="container" id="sections"></div>
  <div class="container">
    <div class="empty" id="empty" style="display:none;">검색 결과가 없습니다.</div>
  </div>
</main>

<footer>
  <div class="container">
    ※ 본 페이지는 <strong>읽기 전용 안내 페이지</strong>입니다. 정보 오류 및 수정 문의는 카페 내 마음의편지함을 이용해 주세요.<br/>
    <span style="display:inline-block;margin-top:8px;">© KRRR · 마지막 업데이트 2026.02.13</span>
  </div>
</footer>

<script>
  // Raw data
  const RAW = [
    ["네이비얼", "https://navyer.kr/", "패션"],
    ["논파운드", "http://www.nonfound.ai", "패션"],
    ["덴아워", "https://thenour.kr/", "패션"],
    ["디앤에스알", "https://www.d-answer.com/", "패션"],
    ["랩12(lab12)", "https://www.lab12.co.kr/", "패션"],
    ["로기(ROGI)", "https://rogi.kr/", "패션"],
    ["로커드", "https://www.lokward.com/", "패션"],
    ["벨즈커피(VleZ coffee)", "https://smartstore.naver.com/vlezcoffee", "식품"],
    ["브랜디드", "https://www.musinsa.com/brand/branded?gf=A", "패션"],
    ["블루 썬플라워(Blue sunflower)", "https://www.bluesf.kr/", "패션"],
    ["뽀빠이", "https://popeyee.com/", "패션"],
    ["소버먼트", "http://www.soverment.com", "패션"],
    ["스펙토", "https://naver.me/FnvWOvMi", "패션"],
    ["슬로우레코드하우스 (SLOWRECORDHOUSE)", "https://slowrecordhouse.com/", "패션"],
    ["아킴", "http://akeem.co.kr", "아동"],
    ["엘무드", "https://lmood.co.kr/", "패션"],
    ["여러분의 얼굴선생님", "https://naver.me/GKvLZx44", "뷰티"],
    ["오엑스 스튜디오", "https://oxstudios.co.kr/", "패션"],
    ["우리두링", "https://wooridooring.com/", "패션"],
    ["워커샵", "http://www.worker-shop.co.kr", "패션"],
    ["유니온블루", "https://www.musinsa.com/brand/unionblue?gf=", "패션"],
    ["윤슬포토", "https://www.instagram.com/yoonseul_photo.wedding", "웨딩"],
    ["일꼬르소", "http://lfmall.com/", "패션"],
    ["집시(JIPSY)", "https://jipsy.co.kr/", "패션"],
    ["코삿", "https://smartstore.naver.com/cosat_apparel/", "패션"],
    ["탑앤탑", "https://smartstore.naver.com/topandtop", "패션"],
    ["티앤지티(TNGT)", "https://www.lfmall.co.kr/", "패션"],
    ["퍼블릭워드로브", "https://www.public-wardrobe.com/", "패션"],
    ["피스", "https://www.piecestudio.co.kr/", "패션"],
    ["하쿠나", "https://www.hacoona.com/", "패션"],
    ["호두네 감귤밭", "https://hodoo-farm.sixshop.site/", "농수산"],
  ].map(([name, url, item]) => ({ name, url, item }));

  // Category groupings (combined)
  const GROUPS = [
    { id: "all",      label: "전체",   desc: "모든 입점 업체",                   items: null,            cls: "" },
    { id: "fashion",  label: "패션",   desc: "의류·잡화·라이프스타일",          items: ["패션"],         cls: "cat-fashion" },
    { id: "food",     label: "푸드",   desc: "식품·농수산물",                    items: ["식품","농수산"], cls: "cat-food" },
    { id: "beauty",   label: "뷰티",   desc: "뷰티·메이크업·스타일링",         items: ["뷰티"],         cls: "cat-beauty" },
    { id: "kids",     label: "아동",   desc: "아동·키즈 브랜드",               items: ["아동"],         cls: "cat-kids" },
    { id: "wedding",  label: "웨딩",   desc: "웨딩·사진·기념일",               items: ["웨딩"],         cls: "cat-wedding" },
  ];

  // Map original category → CSS class
  const ITEM_CLASS = {
    "패션": "cat-fashion",
    "식품": "cat-food",
    "농수산": "cat-food",
    "뷰티": "cat-beauty",
    "아동": "cat-kids",
    "웨딩": "cat-wedding",
  };

  function inGroup(group, item) {
    if (!group.items) return true;
    return group.items.includes(item);
  }

  function groupCount(group) {
    if (!group.items) return RAW.length;
    return RAW.filter(c => group.items.includes(c.item)).length;
  }

  function cleanUrl(url) {
    return url.replace(/^https?:\/\//, "").replace(/\/$/, "");
  }

  let activeGroup = "all";
  let query = "";

  function render() {
    // Tabs
    const tabsEl = document.getElementById("tabs");
    tabsEl.innerHTML = GROUPS.map(g => `
      <button class="tab ${g.id === activeGroup ? "active" : ""}" data-id="${g.id}">
        ${g.label}<span class="count">${groupCount(g)}</span>
      </button>
    `).join("");
    tabsEl.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        activeGroup = btn.dataset.id;
        render();
      });
    });

    // Sort companies alphabetically (Korean locale)
    const sorted = [...RAW].sort((a, b) => a.name.localeCompare(b.name, "ko"));

    // Decide which sections to render
    const sectionsEl = document.getElementById("sections");
    const sectionsToShow = activeGroup === "all"
      ? GROUPS.filter(g => g.id !== "all")
      : GROUPS.filter(g => g.id === activeGroup);

    let totalShown = 0;
    sectionsEl.innerHTML = sectionsToShow.map(group => {
      const items = sorted.filter(c => inGroup(group, c.item) && matchesQuery(c));
      totalShown += items.length;
      if (items.length === 0) return "";

      return `
        <section class="section">
          <div class="section-header">
            <h2>${group.label}</h2>
            <span class="section-count">${items.length}곳</span>
            <span class="section-desc">${group.desc}</span>
          </div>
          <div class="grid">
            ${items.map(c => `
              <a class="card" href="${ensureProtocol(c.url)}" target="_blank" rel="noopener">
                <div class="card-top">
                  <div class="name">${escapeHtml(c.name)}</div>
                  <span class="badge ${ITEM_CLASS[c.item] || ""}">${escapeHtml(c.item)}</span>
                </div>
                <div>
                  <div class="url">${escapeHtml(cleanUrl(c.url))}</div>
                  <div class="visit">사이트 방문</div>
                </div>
              </a>
            `).join("")}
          </div>
        </section>
      `;
    }).join("");

    document.getElementById("empty").style.display = totalShown === 0 ? "block" : "none";
  }

  function matchesQuery(c) {
    if (!query) return true;
    const q = query.toLowerCase();
    return c.name.toLowerCase().includes(q)
        || c.url.toLowerCase().includes(q)
        || c.item.toLowerCase().includes(q);
  }

  function ensureProtocol(url) {
    return /^https?:\/\//i.test(url) ? url : "http://" + url;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  document.getElementById("search").addEventListener("input", e => {
    query = e.target.value.trim();
    render();
  });

  document.getElementById("total-count").textContent = RAW.length;
  render();
</script>

</body>
</html>
